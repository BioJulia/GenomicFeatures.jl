# Benchmarks: on pull requests, AirspeedVelocity.jl runs the pull request's regression suite, benchmark/benchmarks.jl, at the commit of its base branch that it merges onto and at the pull request, and compares them; docs/src/benchmarks.md describes it.
name: Benchmarks

on:
  pull_request:

permissions: {}

jobs:
  regression:
    name: Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@f39cf180e62b34e52ed4d12ccf982d70b118a143 # action-v1.3.0
        with:
          julia-version: '1'
          # The commit of the base branch that the pull request merges onto, which a re-run keeps, and the pull request, whose ratio the table gives.
          rev: ${{ github.event.pull_request.base.sha }},${{ github.event.pull_request.head.sha }}
          # The pull request's own suite runs at both revisions, so that a benchmark it adds or changes is compared, rather than develop's, which the action takes otherwise.
          bench-on: ${{ github.event.pull_request.head.sha }}
          # A fork's pull request can't comment, so its results go to the job summary.
          job-summary: ${{ github.event.pull_request.head.repo.fork }}
