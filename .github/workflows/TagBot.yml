# TagBot: tags each release vX.Y.Z, with its GitHub release, once the registry merges it; the deploy key DOCUMENTER_KEY pushes the tag, so that the tag's workflows, such as the documentation's, run.
name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@87cc4cc2b4639f6c743f5772f376a32914060732 # v1.25.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # The release branch, whose commits TagBot tags: a back-merge into develop may share a release's tree, and without the branch TagBot may pick it.
          branch: master
